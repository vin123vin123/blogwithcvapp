<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified CV2 & Blog App</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1, h2 { color: #1a202c; border-bottom: 2px solid #edf2f7; padding-bottom: 8px; }
        .section { margin-bottom: 40px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input[type="text"], textarea, input[type="file"] { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; }
        textarea { height: 100px; resize: vertical; }
        button { background-color: #3182ce; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; width: 100%; }
        button:hover { background-color: #2b6cb0; }
        .result-box { margin-top: 15px; padding: 15px; border-radius: 6px; display: none; font-family: monospace; font-size: 14px; white-space: pre-wrap; }
        .success { background-color: #c6f6d5; color: #22543d; border: 1px solid #9ae6b4; }
        .error { background-color: #fed7d7; color: #742a2a; border: 1px solid #feb2b2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Unified App Platform</h1>

        <!-- 👁️ SECTION 1: CV2 SHAPE MATCHER -->
        <div class="section">
            <h2>👁️ OpenCV Shape Matcher</h2>
            <form id="cvForm">
                <div class="form-group">
                    <label>1. Upload Template Shape Image:</label>
                    <input type="file" id="templateFile" accept="image/*" required>
                </div>
                <div class="form-group">
                    <label>2. Upload Target Scene Image:</label>
                    <input type="file" id="targetFile" accept="image/*" required>
                </div>
                <button type="submit">Execute Shape Detection</button>
            </form>
            <div id="cvResult" class="result-box"></div>
        </div>

        <!-- 📝 SECTION 2: BLOG POSTER -->
        <div class="section">
            <h2>📝 Add New Blog Post</h2>
            <form id="blogForm">
                <div class="form-group">
                    <label>Blog Title:</label>
                    <input type="text" id="blogTitle" placeholder="Enter post title..." required>
                </div>
                <div class="form-group">
                    <label>Author Name:</label>
                    <input type="text" id="blogAuthor" placeholder="Your name (optional)">
                </div>
                <div class="form-group">
                    <label>Content:</label>
                    <textarea id="blogContent" placeholder="Write your post content here..." required></textarea>
                </div>
                <button type="submit">Publish to MongoDB</button>
            </form>
            <div id="blogResult" class="result-box"></div>
        </div>
    </div>

    <script>
        // 👁️ HANDLE CV2 APPS SUBMIT ACTION
        document.getElementById('cvForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultDiv = document.getElementById('cvResult');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result-box';
            resultDiv.innerText = 'Processing matrices and calculating Hu Moments... Please wait.';

            const formData = new FormData();
            formData.append('template', document.getElementById('templateFile').files[0]);
            formData.append('target', document.getElementById('targetFile').files[0]);

            try {
                const response = await fetch('/api/cv/match-shape', { method: 'POST', body: formData });
                const data = await response.json();
                
                if (data.error) {
                    resultDiv.classList.add('error');
                    resultDiv.innerText = `Error: ${data.error}`;
                } else {
                    resultDiv.classList.add('success');
                    resultDiv.innerText = JSON.stringify(data, null, 2);
                }
            } catch (err) {
                resultDiv.classList.add('error');
                resultDiv.innerText = `Network Error: ${err.message}`;
            }
        });

        // 📝 HANDLE BLOG APP SUBMIT ACTION
        document.getElementById('blogForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultDiv = document.getElementById('blogResult');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result-box';

            const payload = {
                title: document.getElementById('blogTitle').value,
                author: document.getElementById('blogAuthor').value || "Anonymous",
                content: document.getElementById('blogContent').value
            };

            try {
                const response = await fetch('/api/blog', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (data.success) {
                    resultDiv.classList.add('success');
                    resultDiv.innerText = `🎉 Successfully posted to MongoDB! Log ID: ${data.post_id}`;
                    document.getElementById('blogForm').reset();
                } else {
                    resultDiv.classList.add('error');
                    resultDiv.innerText = `Error: ${data.error}`;
                }
            } catch (err) {
                resultDiv.classList.add('error');
                resultDiv.innerText = `Network Error: ${err.message}`;
            }
        });
    </script>
</body>
</html>
